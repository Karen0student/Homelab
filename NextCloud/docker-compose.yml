services:
  mariadb:
    image: mariadb
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --innodb-file-per-table=1 --skip-innodb-read-only-co>
    ports:
      - ${MARIADB_PORT}:3306
    volumes:
      - ${MARIADB_DIR}:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=nextcloud

  nextcloud:
    image: nextcloud
    container_name: nextcloud
    restart: always
    ports:
      - ${NEXTCLOUD_PORT}:80
    links:
      - mariadb:mysql
    volumes:
      - ${NEXTCLOUD_APP_DIR}:/etc/apache2/conf-enabled/servername.conf
      - ${NETCLOUD_DIR}:/var/www/html
      - ${NEXTCLOUD_APPS_DIR}:/var/www/html/custom_apps
      - ${NEXTCLOUD_CONFIG_DIR}:/var/www/html/config
      - ${NEXTCLOUD_DATA_DIR}:/var/www/html/data
    environment:
      - MYSQL_PASSWORD=nextcloud
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=mariadb
