---
services:
  filebrowser:
    image: filebrowser/filebrowser
    container_name: filebrowser
    volumes:
      - ${DIR1}:/srv
      - ${DATABASE}:/database
      - ${CONFIG}:/config
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - ${PORT}:80
    restart: unless-stopped

    # resource limits (single-host docker compose)
    mem_limit: ${RAM}      # hard limit: 1 GB RAM
    cpus: ${CPU}        # allow up to 2 CPU cores (scheduler decides)
    networks:
      - default
      - net


networks:
  net:
