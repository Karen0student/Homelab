services:

  ollama:
    build: .
    image: ollama/ollama:custom  #ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: ${CONTEXT_LENGTH} #65536
      ANTHROPIC_AUTH_TOKEN: ollama
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_BASE_URL: http://127.0.0.1:11434


    volumes:
      - ${OLLAMA_DIR}:/home/ubuntu/.ollama
      - ${OLLAMA_WORKSPACE}:/workspace

    ports:
      - "${OLLAMA_PORT}:11434"

    cpus: ${OLLAMA_CPU}
    mem_limit: ${OLLAMA_RAM}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    networks:
      - ai


  open-webui:
    image: ghcr.io/open-webui/open-webui:cuda
    container_name: open-webui
    restart: unless-stopped

    depends_on:
      - ollama

    ports:
      - "${OPENWEBUI_PORT}:8080"

    cpus: ${OPENWEBUI_CPU}
    mem_limit: ${OPENWEBUI_RAM}

    volumes:
      - ${OPENWEBUI_DIR}:/app/backend/data

    environment:
      OLLAMA_BASE_URL: http://ollama:11434

    networks:
      - ai


networks:
  ai:
    driver: bridge
