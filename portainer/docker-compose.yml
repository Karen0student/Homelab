---
services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "${PORT_1}:9000"
      - "${PORT_2}:8000"
    cpus: ${CPU}
    mem_limit: ${RAM}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - ${DATA_DIR}:/data
    restart: always
    networks:
      - default
      - net


networks:
  net:
