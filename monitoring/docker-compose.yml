version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ${PROMETHEUS_DIR}:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    cpus: ${PROMETHEUS_CPU}
    mem_limit: ${PROMETHEUS_RAM}
    ports:
      - "${PROMETHEUS_PORT}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    network_mode: host

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    cpus: ${NODE_EXPORTER_CPU}
    mem_limit: ${NODE_EXPORTER_RAM}
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT}:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|run/docker/netns)'
      - '--collector.diskstats.ignored-devices=^(ram|loop|fd|(h|s|v|xv)d[a-z]|nvme\\d+n\\d+p)\\d+$'
    restart: unless-stopped
    network_mode: host
    pid: host

  nvidia-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:latest
    container_name: nvidia-exporter
    cpus: ${NVIDIA_EXPORTER_CPU}
    mem_limit: ${NVIDIA_EXPORTER_RAM}
    ports:
      - "127.0.0.1:${NVIDIA_EXPORTER_PORT}:9835"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped
    network_mode: host

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ${GRAFANA_DATASOURCES}:/etc/grafana/provisioning/datasources
    cpus: ${GRAFANA_CPU}
    mem_limit: ${GRAFANA_RAM}
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
